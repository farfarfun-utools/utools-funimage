<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#216b60">
  <title>图片工坊</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3V7Z"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-9 9M19 13v6H5V5h6"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="brand"><img src="logo.svg" alt="" width="40" height="40"><div><h1>图片工坊</h1><span>FunImage</span></div></div>
      <div class="top-actions">
        <button id="add-files" class="button secondary" type="button" data-lock><svg><use href="#icon-plus"/></svg>添加图片</button>
        <button id="start" class="button primary" type="button" data-lock disabled><svg><use href="#icon-play"/></svg>开始处理</button>
        <button id="stop" class="button danger" type="button" hidden><svg><use href="#icon-stop"/></svg>停止后续任务</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="settings" aria-label="处理设置">
        <h2>处理方式</h2>
        <div class="mode-control" role="group" aria-label="处理方式">
          <button type="button" data-operation="compress" data-lock aria-pressed="true">压缩</button>
          <button type="button" data-operation="convert" data-lock aria-pressed="false">转换</button>
          <button type="button" data-operation="resize" data-lock aria-pressed="false">尺寸</button>
        </div>

        <div class="section-rule"></div>
        <fieldset id="options" class="options">
          <div class="option-group" data-for="compress">
            <div class="label-row"><label for="quality">压缩质量</label><output id="quality-value" for="quality">75</output></div>
            <input id="quality" type="range" min="35" max="95" value="75">
            <p>适用于 JPEG、WebP。PNG 按无损方式重新编码；如果文件未变小，则保留原始字节。</p>
          </div>
          <div class="option-group" data-for="convert" hidden>
            <label for="format">目标格式</label>
            <select id="format"><option value="webp">WebP</option><option value="jpeg">JPEG</option><option value="png">PNG</option></select>
          </div>
          <div class="option-group" data-for="resize" hidden>
            <label for="width">目标宽度 · 像素</label>
            <input id="width" type="number" min="1" max="8000" value="1280" inputmode="numeric">
            <p>保持原图宽高比，输出格式与原图相同。</p>
          </div>
        </fieldset>

        <div class="section-rule"></div>
        <h2>输出位置</h2>
        <button id="choose-output" class="output-select" type="button" data-lock><svg><use href="#icon-folder"/></svg><span id="output-label">选择文件夹</span></button>
        <p class="output-note">结果另存为新文件，不覆盖原图。</p>
      </aside>

      <section class="content" aria-label="图片与处理队列">
        <div class="preview-head"><div><h2>预览</h2><p id="preview-meta">选择图片查看</p></div><div class="preview-actions"><button id="show-original" class="preview-tab" type="button" aria-pressed="true" disabled>原图</button><button id="show-result" class="preview-tab" type="button" aria-pressed="false" disabled>效果</button><button id="make-preview" class="button secondary" type="button" disabled>生成效果</button></div></div>
        <div class="preview-stage"><div id="preview-empty" class="preview-empty"><svg><use href="#icon-image"/></svg><span>选择图片查看预览</span></div><img id="preview-image" alt="" hidden></div>
        <div class="queue-head"><div><h2>文件队列 <span id="file-count">0</span></h2><p id="queue-summary">等待添加图片</p></div><button id="clear-done" class="text-button" type="button" data-lock hidden>清除已完成</button></div>
        <progress id="batch-progress" class="batch-progress" value="0" max="1" aria-label="批量处理进度" hidden></progress>
        <ul id="job-list" class="job-list" aria-label="待处理图片"></ul>
        <div id="notice" class="notice" role="status" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <div id="drop-overlay" class="drop-overlay" hidden>松开以添加图片</div>
</body>
</html>
