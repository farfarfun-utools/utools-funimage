<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19332d">
  <title>图片工坊</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./workshop.css">
  <link rel="stylesheet" href="/vendor/cropper.min.css">
  <script src="/vendor/pdf-lib.min.js" defer></script>
  <script>var exports = {};</script>
  <script src="/vendor/gifenc.js" defer></script>
  <script src="/vendor/cropper.min.js" defer></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3V7Z"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-9 9M19 13v6H5V5h6"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="brand"><img src="/logo.svg" alt="" width="40" height="40"><div><h1>图片工坊</h1><span>FunImage</span></div></div>
      <div class="top-actions">
        <button id="add-files" class="button secondary" type="button" data-lock><svg><use href="#icon-plus"/></svg>添加图片</button>
      </div>
      <button id="open-settings" class="icon-button" type="button" title="设置" aria-label="设置" aria-haspopup="dialog" aria-controls="settings-dialog" data-lock><svg><use href="#icon-settings"/></svg></button>
    </header>

    <main class="workspace">
      <nav class="toolnav" aria-label="处理工具">
        <div id="category-rail" class="category-rail" aria-label="工具分类"></div>
        <div class="tool-panel"><span class="tool-caption">选择工具</span><div id="tool-list" class="tool-list"></div></div>
        <select id="operation" aria-label="处理方式" data-lock hidden>
          <optgroup label="优化与格式"><option value="compress">压缩图片</option><option value="convert">格式转换</option><option value="resize">修改尺寸</option></optgroup>
          <optgroup label="画面编辑"><option value="crop">按尺寸裁剪</option><option value="manualCrop">手动裁剪</option><option value="rotate">旋转</option><option value="flip">翻转</option></optgroup>
          <optgroup label="外观设计"><option value="watermark">添加水印</option><option value="round">圆角</option><option value="border">边框</option><option value="shadow">添加阴影</option><option value="pad">补边留白</option></optgroup>
          <optgroup label="合并导出"><option value="merge">合并图片</option><option value="mergePdf">合并 PDF</option><option value="mergeGif">合并 GIF</option></optgroup>
        </select>
      </nav>
      <aside class="settings" aria-label="处理参数">
        <div class="settings-heading"><h2>压缩参数</h2><span id="operation-description">批量压缩图片</span></div>
        <fieldset id="options" class="options">
          <div class="option-group" data-for="compress">
            <div class="label-row"><label for="quality">压缩质量</label><output id="quality-value" for="quality">75</output></div>
            <input id="quality" type="range" min="35" max="95" value="75">
            <label for="target-size">目标大小 · KB（可选）</label><input id="target-size" type="number" min="1" max="32768" placeholder="不限制">
          </div>
          <div class="option-group" data-for="convert" hidden>
            <label for="format">目标格式</label>
            <select id="format"><option value="webp">WebP</option><option value="jpeg">JPEG</option><option value="png">PNG</option><option value="avif">AVIF</option><option value="gif">GIF</option><option value="bmp">BMP</option><option value="tiff">TIFF</option><option value="ico">ICO</option></select>
          </div>
          <div class="option-group" data-for="resize" hidden>
            <label for="width">宽度 · 像素</label><input id="width" type="number" min="1" max="8000" value="1280">
            <label for="height">高度 · 像素（可选）</label><input id="height" type="number" min="1" max="8000" placeholder="按比例">
          </div>
          <div class="option-group" data-for="watermark" hidden><label for="watermark-mode">水印类型</label><select id="watermark-mode"><option value="text">文字</option><option value="image">图片</option></select><div id="watermark-text-options" class="nested-options"><label for="watermark-text">水印文字</label><input id="watermark-text" type="text" maxlength="100" value="图片工坊"><label for="watermark-size">字号 · 像素</label><input id="watermark-size" type="number" min="8" max="300" value="32"><label for="watermark-color">颜色</label><input id="watermark-color" type="color" value="#ffffff"></div><div id="watermark-image-options" class="nested-options" hidden><label>水印图片</label><div id="watermark-file" class="file-label">尚未选择</div><button id="choose-watermark" class="button secondary" type="button">选择图片</button><label for="watermark-image-width">水印宽度 · 像素</label><input id="watermark-image-width" type="number" min="1" max="2000" value="180"></div><label for="watermark-position">位置</label><select id="watermark-position"><option value="bottom-right">右下</option><option value="bottom-left">左下</option><option value="top-right">右上</option><option value="top-left">左上</option><option value="center">居中</option></select><label for="watermark-opacity">不透明度</label><input id="watermark-opacity" type="range" min="10" max="100" value="80"></div>
          <div class="option-group" data-for="round" hidden><label for="radius">圆角半径 · 像素</label><input id="radius" type="number" min="1" max="2000" value="40"></div>
          <div class="option-group" data-for="border" hidden><label for="border-size">边框宽度 · 像素</label><input id="border-size" type="number" min="1" max="1000" value="12"><label for="border-color">边框颜色</label><input id="border-color" type="color" value="#e85b47"></div>
          <div class="option-group" data-for="shadow" hidden><label for="shadow-blur">模糊半径 · 像素</label><input id="shadow-blur" type="number" min="0" max="100" value="24"><label for="shadow-x">水平偏移 · 像素</label><input id="shadow-x" type="number" min="-200" max="200" value="0"><label for="shadow-y">垂直偏移 · 像素</label><input id="shadow-y" type="number" min="-200" max="200" value="14"><label for="shadow-color">阴影颜色</label><input id="shadow-color" type="color" value="#253b33"><label for="shadow-opacity">不透明度</label><input id="shadow-opacity" type="range" min="10" max="100" value="35"></div>
          <div class="option-group" data-for="pad" hidden><label for="pad-width">画布宽度 · 像素</label><input id="pad-width" type="number" min="1" max="8000" value="1600"><label for="pad-height">画布高度 · 像素</label><input id="pad-height" type="number" min="1" max="8000" value="900"><label for="pad-color">留白颜色</label><input id="pad-color" type="color" value="#ffffff"></div>
          <div class="option-group" data-for="crop" hidden><label for="crop-x">起点 X · 像素</label><input id="crop-x" type="number" min="0" max="8000" value="0"><label for="crop-y">起点 Y · 像素</label><input id="crop-y" type="number" min="0" max="8000" value="0"><label for="crop-width">裁剪宽度</label><input id="crop-width" type="number" min="1" max="8000" value="800"><label for="crop-height">裁剪高度</label><input id="crop-height" type="number" min="1" max="8000" value="600"></div>
          <div class="option-group" data-for="manualCrop" hidden><button id="edit-crop" class="button secondary" type="button">调整当前图片裁剪区域</button><p id="crop-status">逐张选择图片并设置裁剪区域</p></div>
          <div class="option-group" data-for="rotate" hidden><label for="rotation">旋转角度</label><select id="rotation"><option value="90">顺时针 90°</option><option value="180">180°</option><option value="270">逆时针 90°</option></select></div>
          <div class="option-group" data-for="flip" hidden><label for="flip-axis">翻转方向</label><select id="flip-axis"><option value="horizontal">水平翻转</option><option value="vertical">垂直翻转</option></select></div>
          <div class="option-group" data-for="merge" hidden><label for="merge-direction">拼接方向</label><select id="merge-direction"><option value="vertical">纵向</option><option value="horizontal">横向</option></select><label for="merge-gap">图片间距 · 像素</label><input id="merge-gap" type="number" min="0" max="500" value="0"><label for="merge-color">背景颜色</label><input id="merge-color" type="color" value="#ffffff"></div>
          <div class="option-group" data-for="mergePdf" hidden><p>队列顺序即 PDF 页码顺序，每张图片占一页。</p></div>
          <div class="option-group" data-for="mergeGif" hidden><label for="gif-delay">每帧时长 · 毫秒</label><input id="gif-delay" type="number" min="20" max="10000" step="10" value="500"><label for="gif-width">动图宽度 · 像素</label><input id="gif-width" type="number" min="1" max="1200" value="640"></div>
        </fieldset>

      </aside>

      <section class="content" aria-label="图片与处理队列">
        <section class="preview" aria-labelledby="preview-title">
          <div class="preview-head"><div><h2 id="preview-title">预览</h2><p id="preview-meta">选择图片查看</p></div><div class="preview-actions"><button id="show-original" class="preview-tab" type="button" aria-pressed="true" disabled>原图</button><button id="show-result" class="preview-tab" type="button" aria-pressed="false" disabled>效果</button><button id="make-preview" class="button secondary" type="button" disabled>生成效果</button></div></div>
          <div class="preview-stage"><div id="preview-empty" class="preview-empty"><svg><use href="#icon-image"/></svg><strong>还没有图片</strong><button id="add-empty" class="button secondary" type="button"><svg><use href="#icon-plus"/></svg>添加图片</button></div><img id="preview-image" alt="" hidden></div>
        </section>
        <section class="image-queue" aria-labelledby="queue-title">
          <div class="queue-head"><div><h2 id="queue-title">文件队列 <span id="file-count">0</span></h2><p id="queue-summary">等待添加图片</p></div><button id="clear-done" class="text-button" type="button" data-lock hidden>清除已完成</button></div>
          <progress id="batch-progress" class="batch-progress" value="0" max="1" aria-label="批量处理进度" hidden></progress>
          <div id="notice" class="notice" role="status" aria-live="polite"></div>
          <div id="queue-empty" class="queue-empty">暂无待处理图片</div>
          <ul id="job-list" class="job-list" aria-label="待处理图片"></ul>
        </section>
      </section>
      <footer class="runbar"><div class="destination"><svg><use href="#icon-folder"/></svg><span id="footer-output">尚未设置输出位置</span></div><div class="run-actions"><button id="start" class="button primary" type="button" data-lock disabled><svg><use href="#icon-play"/></svg>开始处理</button><button id="stop" class="button danger" type="button" title="当前图片处理结束后停止" hidden><svg><use href="#icon-stop"/></svg>停止</button></div></footer>
    </main>
  </div>
  <div id="drop-overlay" class="drop-overlay" hidden>松开以添加图片</div>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-head"><h2 id="settings-title">设置</h2><button id="close-settings" class="icon-button" type="button" title="关闭" aria-label="关闭"><svg><use href="#icon-close"/></svg></button></div>
    <div class="dialog-content">
      <div class="dialog-label">输出位置</div>
      <div id="output-label" class="output-path" title="尚未设置">尚未设置</div>
      <p class="output-note">处理结果另存为新文件，不覆盖原图。</p>
      <div class="dialog-actions"><button id="choose-output" class="button primary" type="button" data-lock><svg><use href="#icon-folder"/></svg>选择文件夹</button></div>
    </div>
  </dialog>
  <dialog id="crop-dialog" class="settings-dialog crop-dialog" aria-labelledby="crop-title"><div class="dialog-head"><h2 id="crop-title">手动裁剪</h2><button id="close-crop" class="icon-button" type="button" title="关闭" aria-label="关闭"><svg><use href="#icon-close"/></svg></button></div><div class="crop-stage"><img id="crop-image" alt="待裁剪图片"></div><div class="dialog-actions crop-actions"><button id="save-crop" class="button primary" type="button">应用裁剪</button></div></dialog>
</body>
</html>
